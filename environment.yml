name: fennec
channels:
  # `defaults` (repo.anaconda.com) is deliberately omitted: every package below is
  # available from conda-forge/bioconda, and Anaconda's default channels require a
  # paid licence for larger organisations and are blocked on many research networks.
  - pytorch
  - nvidia
  - conda-forge
  - bioconda

dependencies:
  # Python 3.12 recommended — primer3-py==2.0.3 (required by BioInUtils) does
  # not build on Python 3.14 due to deprecated Cython 'IF' statements.
  # If you must use Python >=3.13, install BioInUtils with --no-deps and use
  # the newer primer3-py (>=2.3.0) which is API-compatible for fennec's needs.
  - python=3.12
  - pip

  # Core data / ML
  # numpy MUST stay <2: pytorch 2.2.2 (pinned below) is compiled against the
  # NumPy 1.x C API. With numpy>=2 torch still imports but its NumPy interop is
  # dead ("Failed to initialize NumPy: _ARRAY_API not found"), which breaks every
  # tensor<->array conversion in the preprocessing pipeline.
  - numpy<2
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - tqdm
  - jupyter
  - notebook
  - pytest           # README documents `pytest tests/` as the verification step

  # PyTorch with CUDA 12.1 (required by mamba-ssm / Orthrus backbone)
  - pytorch=2.2.2
  - pytorch-cuda=12.1

  # ViennaRNA — required by bioinutils.vienna.rfold (thermo features)
  # Provides the RNAfold CLI tool called via the `sh` Python package
  - viennarna  # available in bioconda and conda-forge

  - pip:
      # Core bioinformatics
      - biopython
      - edlib
      - primer3-py==2.0.3
      - click
      - xmltodict        # required by BioInUtils
      - sh               # required by BioInUtils (calls RNAfold)

      # RNA Foundation Models
      - rna-fm           # provides the `fm` module (RNA-FM T12)
      # transformers MUST stay <5: v5 requires torch>=2.5 and silently disables its
      # PyTorch backend against the pinned torch 2.2.2, so AutoModel.from_pretrained
      # (how Orthrus is loaded) stops working.
      - transformers<5   # HuggingFace — used to load Orthrus via AutoModel
      # - rinalmo        # optional alternative FM (guarded import in fm_utils.py)

      # publication_analyses/ only — imported by the paper's analysis scripts
      - captum==0.7.0    # integrated gradients (Fig 5); version used in the paper
      - umap-learn       # dataset projections (OligoFormer inter-dataset panel)
      - requests         # competitor prediction APIs
      - urllib3

      # NOTE: the Orthrus Mamba backbone (causal_conv1d, mamba-ssm) is deliberately
      # NOT installed here. Both compile CUDA kernels from source, which needs a
      # CUDA 12.1 toolkit (nvcc) and must be run with --no-build-isolation so the
      # build can see torch. Installing them inline makes `conda env create` fail on
      # any machine without nvcc, including CPU-only machines and cluster login
      # nodes. Install them as a separate step after activating the environment:
      #
      #   export TORCH_CUDA_ARCH_LIST=8.9   # your GPU's compute capability
      #   pip install --no-build-isolation causal_conv1d==1.2.0.post2 mamba-ssm==1.2.0.post1
      #
      # They are required only for the Orthrus 4-track FM backbone; the rest of
      # fennec (featurization, HELM conversion, model definitions) works without them.

      # fennec (this package) — editable install from repo root
      - -e .

      # ---------------------------------------------------------------
      # GitHub-only packages — install MANUALLY after `conda env create`:
      #
      #   pip install git+https://github.com/Zinthrow/BioInUtils.git
      #
      #     Provides: bioinutils.seqfeatures.utils, bioinutils.vienna
      #     Used for: Tm, homo/heterodimer dG, Vienna secondary structure
      #     (thermo features via --with-thermo flag)
      #
      #     NOTE: BioInUtils pins primer3-py==2.0.3. On Python >=3.13 you
      #     may need: pip install git+https://github.com/Zinthrow/BioInUtils.git
      #                           --no-deps
      #
      #   git clone https://github.com/bowang-lab/Orthrus.git
      #   pip install -e Orthrus/ --no-deps   (avoids GenomeKit requirement)
      #
      #     Provides: orthrus.gk_utils.seq_to_oh
      #     Used for: Orthrus 4-track mRNA embedding (--fm-type orthrus_4track)
      #     The model weights are downloaded automatically from HuggingFace:
      #       AutoModel.from_pretrained("antichronology/orthrus-4-track",
      #                                 trust_remote_code=True)
      # ---------------------------------------------------------------

# -----------------------------------------------------------------------
# Quick-start (after cloning this repo):
#
#   conda env create -f environment.yml
#   conda activate fennec
#
#   # GitHub-only packages:
#   pip install git+https://github.com/Zinthrow/BioInUtils.git
#   git clone https://github.com/bowang-lab/Orthrus.git
#   pip install -e Orthrus/ --no-deps
#
#   # Verify:
#   python tests/test_env.py
# -----------------------------------------------------------------------
